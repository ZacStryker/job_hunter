events {}

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/hitlobster.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hitlobster.ai/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 20m;

        location /api/activity/stream {
            proxy_pass            http://app:3000;
            proxy_read_timeout    3600s;
            proxy_connect_timeout 10s;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_buffering       off;
            proxy_cache           off;
            proxy_http_version    1.1;
            proxy_set_header      Connection        '';
        }

        location ~ ^/api/onboarding/(linkedin|indeed)/browser/[^/]+/ws$ {
            proxy_pass            http://app:3000;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_buffering       off;
            proxy_http_version    1.1;
            proxy_set_header      Upgrade           $http_upgrade;
            proxy_set_header      Connection        "upgrade";
        }

        location / {
            proxy_pass            http://app:3000;
            proxy_read_timeout    120s;
            proxy_connect_timeout 10s;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
        }
    }
}
